<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zeitrechner | N-Corp</title>

    <link rel="stylesheet" href="timecalc.css" />
    <script src="timecalc.js" defer></script>
  </head>

  <body>

    <header class="topnav">
      <a href="index.html" class="home-link"> N-Corp </a>

      <span class="page-title">Time Calculator</span>
    </header>

    <main class="page-content">
      <section class="intro">
        <h1>Time Calculator</h1>
      </section>

      <div class="calculator-grid">
        <!-- TIME DIFFERENCE -->

        <section class="calculator-card">
          <div class="card-icon">⏱️</div>

          <h2>Time Difference</h2>

          <p class="card-description">
            Calculate how much time passes between two times.
          </p>

          <div class="input-group">
            <label for="start">Start time</label>
            <input
              type="text"
              id="start"
              value="00:00"
              placeholder="HH:MM"
              inputmode="numeric"
              maxlength="5"
            />
          </div>

          <div class="input-group">
            <label for="end">End time</label>
            <input
              type="text"
              id="end"
              value="00:00"
              placeholder="HH:MM"
              inputmode="numeric"
              maxlength="5"
            />
          </div>

          <button type="button" id="submitB" class="calculate-button">
            Calculate Difference
          </button>

          <div class="result" id="differenceResult">
            Result will appear here
          </div>
        </section>

        <!-- ADD TIME -->

        <section class="calculator-card">
          <div class="card-icon">🕒</div>

          <h2>Add Time</h2>

          <p class="card-description">
            Add hours and minutes to a selected time.
          </p>

          <div class="input-group">
            <label for="timeInput">Time</label>

            <input
              type="text"
              id="timeInput"
              value="00:00"
              placeholder="HH:MM"
              inputmode="numeric"
              maxlength="5"
            />
          </div>

          <div class="time-add-inputs">
            <div class="input-group">
              <label for="hoursInput">Hours</label>

              <input type="number" id="hoursInput" value="0" placeholder="0" />
            </div>

            <div class="input-group">
              <label for="minutesInput">Minutes</label>

              <input
                type="number"
                id="minutesInput"
                value="0"
                placeholder="0"
              />
            </div>
          </div>

          <button type="button" id="addTimeButton" class="calculate-button">
            Add Time
          </button>

          <div class="result" id="addResult">Result will appear here</div>
        </section>
      </div>
    </main>
  </body>
</html>
