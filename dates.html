<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Date Picker | N-Corp</title>

    <link rel="stylesheet" href="dates.css">

    <script
        src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>

    <script src="dates.js" defer></script>
</head>

<body>

    <header class="topnav">
        <a href="index.html" class="home-link">
            N-Corp
        </a>

        <span class="page-title">
            Date Picker
        </span>
    </header>


    <main class="page-content">

        <section class="intro">

            <p class="eyebrow">
                N-Corp Tools
            </p>

            <h1>
                Date Picker
            </h1>

        </section>


        <section class="picker-card">

            <div class="card-header">

                <div class="card-icon">
                    ❤️
                </div>

                <div>
                    <h2 id="categoryTitle">
                        All Dates
                    </h2>

                    <p id="categoryDescription">
                        Pick from all available date ideas.
                    </p>
                </div>

            </div>


            <!-- CATEGORY SWITCH -->

            <div class="category-switch">

                <button
                    type="button"
                    class="category-button active"
                    data-category="all"
                >
                    ❤️ All Dates
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="first"
                >
                    ✨ First Dates
                </button>

            </div>


            <!-- PICK BUTTON -->

            <button
                type="button"
                id="pick"
                class="pick-button"
            >
                🎲 Pick a Date
            </button>


            <!-- RESULT -->

            <div
                id="result"
                class="result"
            >
                Your date idea will appear here
            </div>


            <!-- DATE OPTIONS -->

            <div
                id="panel-container"
                class="panel-container"
            >
            </div>

        </section>

    </main>

</body>

</html>
